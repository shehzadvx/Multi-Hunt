<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL // BCA AI & MCA Induction Hunt</title>
<style>
  :root{
    --bg: #0B0F14;
    --panel: #10161D;
    --panel-edge: #1C2530;
    --amber: #FFB020;
    --cyan: #2DD4CF;
    --text: #E8EDF2;
    --muted: #5B6B7A;
    --danger: #FF5C5C;
    --mono: 'Space Mono', 'Courier New', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; min-height:100vh;
    background: radial-gradient(circle at 50% 0%, #121a22 0%, var(--bg) 60%);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  @font-face{
    font-family:'Space Mono';
    src: local('Space Mono');
  }
  .scanlines{
    position: fixed; inset:0; pointer-events:none; z-index:1;
    background: repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px,
      transparent 1px, transparent 3px
    );
    mix-blend-mode: overlay;
  }
  .wrap{
    position:relative; z-index:2;
    max-width: 560px; margin: 0 auto;
    min-height: 100vh;
    padding: 28px 20px 60px;
    display:flex; flex-direction:column;
    gap: 18px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-family: var(--mono);
    font-size: 11px; letter-spacing: 3px; color: var(--muted);
    text-transform: uppercase;
  }
  .brand .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }

  h1{
    font-family: var(--mono);
    font-size: 26px; line-height:1.2; margin: 4px 0 0;
    letter-spacing: 0.5px;
  }
  h1 span{ color: var(--amber); }

  .sub{ color: var(--muted); font-size: 14px; line-height:1.5; }

  .card{
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    padding: 22px;
    position: relative;
    overflow: hidden;
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, var(--amber), var(--cyan), transparent);
    opacity:.6;
  }

  .label{
    font-family: var(--mono); font-size: 11px; letter-spacing:2px;
    color: var(--muted); text-transform:uppercase; margin-bottom: 10px;
  }

  .team-grid{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap:10px;
  }
  .team-btn{
    font-family: var(--mono); font-size: 18px; font-weight:700;
    padding: 18px 0; border-radius: 10px;
    border: 1px solid var(--panel-edge);
    background: #0D1319; color: var(--text);
    cursor:pointer; transition: all .15s ease;
  }
  .team-btn:hover{ border-color: var(--cyan); color: var(--cyan); transform: translateY(-2px); }
  .team-btn:active{ transform: translateY(0); }

  select, input[type=text]{
    width:100%; font-family: var(--mono); font-size:15px;
    background:#0D1319; color:var(--text);
    border:1px solid var(--panel-edge); border-radius:8px;
    padding: 12px 14px; outline:none;
  }
  select:focus, input[type=text]:focus{ border-color: var(--cyan); }

  .station-tag{
    display:inline-block; font-family: var(--mono); font-size:11px;
    letter-spacing:1.5px; color: var(--bg); background: var(--amber);
    padding: 4px 10px; border-radius:20px; margin-bottom:14px;
    text-transform:uppercase;
  }

  .riddle-text{
    font-size: 17px; line-height:1.6; margin: 4px 0 18px;
  }

  button.submit{
    width:100%; font-family:var(--mono); font-size:14px; letter-spacing:1px;
    text-transform:uppercase; padding: 14px 0; border-radius:8px;
    border:none; background: var(--cyan); color:#04211f; font-weight:700;
    cursor:pointer; transition: all .15s ease;
  }
  button.submit:hover{ filter: brightness(1.1); }
  button.submit:active{ transform: scale(0.98); }

  .msg{ font-family: var(--mono); font-size: 13px; margin-top:12px; min-height:18px; }
  .msg.err{ color: var(--danger); }
  .msg.ok{ color: var(--cyan); }

  .reveal{
    text-align:center; padding: 10px 0;
  }
  .codeword{
    font-family: var(--mono); font-size: 34px; font-weight:700;
    color: var(--amber); letter-spacing: 3px; margin: 10px 0;
    text-shadow: 0 0 20px rgba(255,176,32,0.35);
  }
  .next-line{
    font-size:15px; color: var(--text); margin-top: 10px;
  }
  .next-line b{ color: var(--cyan); }

  .final-card{
    text-align:center; padding: 34px 22px;
  }
  .final-phrase{
    font-family: var(--mono); font-size: 26px; font-weight:700;
    color: var(--amber); line-height:1.5; letter-spacing:1px;
    margin: 14px 0 6px;
    animation: decode 1.1s ease;
  }
  @keyframes decode{
    0%{ filter: blur(6px); opacity:0; letter-spacing: 10px; }
    100%{ filter: blur(0); opacity:1; letter-spacing: 1px; }
  }

  .progress-row{ display:flex; gap:6px; margin-top: 8px; }
  .progress-dot{
    flex:1; height:5px; border-radius:3px; background: var(--panel-edge);
  }
  .progress-dot.done{ background: var(--cyan); }

  .footer-link{
    text-align:center; margin-top: 6px;
  }
  .footer-link a{
    color: var(--muted); font-family: var(--mono); font-size:11px;
    letter-spacing:1px; text-decoration:none; border-bottom: 1px dotted var(--muted);
  }

  .host-table{ width:100%; border-collapse: collapse; font-family: var(--mono); font-size:13px; }
  .host-table th, .host-table td{
    text-align:left; padding: 8px 6px; border-bottom:1px solid var(--panel-edge);

  .host-table th{ color: var(--muted); font-weight:400; letter-spacing:1px; }
  .pill{
    display:inline-block; width:10px; height:10px; border-radius:50%;
    background: var(--panel-edge); margin-right:3px;
  }
  .pill.on{ background: var(--cyan); }

  .back-btn{
    background:none; border:1px solid var(--panel-edge); color:var(--muted);
    font-family: var(--mono); font-size:11px; letter-spacing:1px;
    padding: 8px 14px; border-radius:20px; cursor:pointer; text-transform:uppercase;
    width: fit-content;
  }
  .back-btn:hover{ color:var(--text); border-color: var(--cyan); }

  .lock-box{ margin-top: 22px; padding-top: 20px; border-top: 1px dashed var(--panel-edge); }
  .lock-title{
    font-family: var(--mono); font-size:12px; letter-spacing:2px;
    color: var(--muted); text-transform:uppercase; margin-bottom: 10px;
  }
  .lock-row{ display:flex; gap:8px; }
  .lock-row input{ flex:1; text-align:center; letter-spacing:2px; text-transform:uppercase; }
  .lock-row button{
    font-family:var(--mono); font-size:13px; letter-spacing:1px; text-transform:uppercase;
    padding: 0 18px; border-radius:8px; border:none;
    background: var(--amber); color:#241800; font-weight:700; cursor:pointer;
  }
  .lock-row button:hover{ filter: brightness(1.1); }
  .lb-title{
    font-family: var(--mono); font-size:20px; color: var(--cyan);
    letter-spacing:1px; margin: 4px 0 14px; text-align:center;
  }
  .lb-rank{ font-family: var(--mono); font-weight:700; }
  .lb-rank.gold{ color: var(--amber); }

  .timer-row{ margin-top:14px; font-family: var(--mono); font-size:13px; }
  #timerBadge{ color: var(--cyan); font-weight:700; }
  #timerBadge.timer-warn{ color: var(--amber); }
  #timerBadge.timer-over{ color: var(--danger); }
  .timer-note{ color: var(--muted); font-size:11px; }
  .reinstate-btn{
    font-family: var(--mono); font-size:11px; letter-spacing:0.5px; text-transform:uppercase;
    padding: 4px 10px; border-radius:6px; border:1px solid var(--cyan); background:transparent;
    color: var(--cyan); cursor:pointer;
  }
  .reinstate-btn:hover{ background: var(--cyan); color:#031414; }
</style>
</head>

// ---------- FIREBASE ----------
const firebaseConfig = {

// Mobile browsers can suspend a tab's JS almost immediately after it's
// backgrounded — an in-flight `await db.ref(...).set(...)` can get cut off
// before it reaches the network. sendBeacon is built specifically to survive
// exactly this (page hidden/unloading), so violation writes use it instead.
const DB_URL = "https://multi-hunt-default-rtdb.asia-southeast1.firebasedatabase.app";
function sendViolationBeacon(team, station){
  const url = `${DB_URL}/hunt/${team}/violationEvents.json`;
  const payload = JSON.stringify({ station: station, time: Date.now() });
  try{
    navigator.sendBeacon(url, new Blob([payload], { type: 'text/plain' }));
  }catch(e){ console.error('violation beacon failed', e); }
}
function violationCount(progress){
  if(progress.violationEvents) return Object.keys(progress.violationEvents).length;
  return progress.violations || 0;
}
function lastViolationStation(progress){
  if(progress.violationEvents){
    const keys = Object.keys(progress.violationEvents);
    if(keys.length) return progress.violationEvents[keys[keys.length - 1]].station;
  }
  return progress.disqualifiedStation || null;
}

    B: { q: "Unscramble the thing that destroys your carefully gelled hair the second you step outside for a smoke break: D N I W", a: ["wind"], t: 60 },

    E: { q: "4 panes per window, 3 windows — more panes of glass than excuses your friend has for skipping class. Total panes?", a: ["12"], t: 75 },
    F: { q: "Unscramble what a window is made of, unlike your excuses which are made of pure fiction: A G L S S", a: ["glass"], t: 60 },

const TEAMS = ["A","B","C","D","E","F","G"];

// ---------- STATE ----------
const params = new URLSearchParams(window.location.search);
let currentStation = params.get('station') ? parseInt(params.get('station')) : null;
let currentTeam = null;

const content = document.getElementById('content');
const hostLink = document.getElementById('hostLink');
hostLink.addEventListener('click', (e) => { e.preventDefault(); renderHost(); });

function normalize(s){ return s.trim().toLowerCase().replace(/\s+/g,' '); }

// ---------- ANTI-CHEAT: penalize leaving the app while a riddle is active ----------
let awayTrackingActive = false;
let awayViolationPending = false;

let lastViolationAt = 0;
function markLeave(){
  if(!awayTrackingActive || awayViolationPending) return;
  const now = Date.now();
  if(now - lastViolationAt < 4000) return; // hard backstop: no 2 violations within 4s, whatever the cause
  lastViolationAt = now;
  awayViolationPending = true;
  sendViolationBeacon(currentTeam, currentStation);
}
function markReturn(){
  if(!awayViolationPending) return;
  awayViolationPending = false;
  awayTrackingActive = false;
  (async () => {
    const progress = await getProgress(currentTeam);
    const count = violationCount(progress);
    if(count >= 2){
      progress.disqualifiedStation = lastViolationStation(progress);
      renderDisqualified(progress);
    } else if(count >= 1){
      renderWarning(count, async () => {
        progress.violationSeen = count;
        await saveProgress(currentTeam, progress);
        renderRiddle();
      });
    }
  })();
}

document.addEventListener('visibilitychange', () => {
  if(!awayTrackingActive) return;
  if(document.hidden) markLeave(); else markReturn();
});
// Catches more leave-gestures than visibilitychange alone (e.g. some
// swipe-up home-screen previews) — at the cost of occasionally firing on
// harmless things like the keyboard opening or a notification banner.
window.addEventListener('blur', () => { if(awayTrackingActive) markLeave(); });
window.addEventListener('focus', () => { if(awayViolationPending) markReturn(); });

function renderWarning(count, onContinue){
  content.innerHTML = `
    <div class="card">
      <div class="station-tag">Station ${currentStation} · Team ${currentTeam}</div>
      <div class="label" style="margin-top:10px; color: var(--amber);">⚠️ Warning ${count}/2</div>
      <div class="sub" style="margin:10px 0;">You left the app while a signal was active. One more time and your team is disqualified.</div>
      <button class="submit" id="continueBtn">Continue</button>
    </div>
  `;
  document.getElementById('continueBtn').addEventListener('click', onContinue || renderRiddle);
}

async function getProgress(team){
  try{
    const snap = await db.ref(`hunt/${team}`).get();
    return snap.exists() ? snap.val() : {};
  }catch(e){ console.error('storage read failed', e); return {}; }
}
async function saveProgress(team, progress){
  try{
    await db.ref(`hunt/${team}`).set(progress);
  }catch(e){ console.error('storage save failed', e); }
}

// ---------- RENDER: station picker (fallback if no ?station= param) ----------
function renderStationPicker(){
  content.innerHTML = `
    <div class="card">
      <div class="label">Select Station</div>
      <div class="sub" style="margin-bottom:12px;">This QR wasn't tagged with a station. Pick one to continue (host/testing only).</div>
      <select id="stationSelect">
        <option value="">— choose a station —</option>
        ${Object.entries(STATIONS).map(([id,s]) => `<option value="${id}">${id}. ${s.name}</option>`).join('')}
      </select>
    </div>
  `;
  document.getElementById('stationSelect').addEventListener('change', (e) => {
    currentStation = parseInt(e.target.value);
    if(currentStation) renderTeamSelect();
  });
}

// ---------- RENDER: team select ----------
let DEVICE_ID = localStorage.getItem('signalDeviceId');
if(!DEVICE_ID){
  DEVICE_ID = 'dev-' + Math.random().toString(36).slice(2, 10);
  localStorage.setItem('signalDeviceId', DEVICE_ID);
}

function renderTeamSelect(){
  content.innerHTML = `
    <div class="card">
      <div class="station-tag">Station ${currentStation} · ${STATIONS[currentStation].name}</div>
      <div class="label">Who's scanning?</div>
      <div class="team-grid">
        ${TEAMS.map(t => `<button class="team-btn" data-team="${t}">${t}</button>`).join('')}
      </div>
    </div>
  `;
  document.querySelectorAll('.team-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const t = btn.getAttribute('data-team');
      try{
        const claimSnap = await db.ref(`hunt/${t}/claimedBy`).get();
        if(claimSnap.exists() && claimSnap.val() !== DEVICE_ID){
          content.innerHTML = `
            <div class="card">
              <div class="label" style="color: var(--danger);">🔒 Team ${t} is locked</div>
              <div class="sub" style="margin:10px 0;">This team is already active on another phone. Only your host can release this lock.</div>
              <button class="back-btn" id="backBtn2" style="margin:10px auto 0;">← choose another team</button>
            </div>
          `;
          document.getElementById('backBtn2').addEventListener('click', renderTeamSelect);
          return;
        } else if(!claimSnap.exists()){
          await db.ref(`hunt/${t}/claimedBy`).set(DEVICE_ID);
        }
      }catch(e){ console.error('claim check failed', e); }
      currentTeam = t;
      renderRiddle();
    });
  });
}

// ---------- RENDER: riddle / already solved / final ----------
async function renderRiddle(){
  content.innerHTML = `<div class="card"><div class="label">Loading signal…</div></div>`;
  const progress = await getProgress(currentTeam);

  const vCount = violationCount(progress);
  if(vCount >= 2){
    progress.disqualifiedStation = lastViolationStation(progress);
    renderDisqualified(progress);
    return;
  }

  if(vCount >= 1 && (progress.violationSeen || 0) < vCount){
    renderWarning(vCount, async () => {
      progress.violationSeen = vCount;
      await saveProgress(currentTeam, progress);
      renderRiddle();
    });
    return;
  }

  if(progress[currentStation]){
    renderAlreadySolved(progress);
    return;
  }

  const seq = SEQUENCE[currentTeam];
  const nextStation = seq.find(s => !progress[s]);
  if(currentStation !== nextStation){
    renderWrongStation(nextStation);
    return;
  }

  const riddle = RIDDLES[currentStation][currentTeam];
  const doneCount = Object.keys(progress).length;

  content.innerHTML = `
    <div class="card">
      <div class="station-tag">Station ${currentStation} · Team ${currentTeam}</div>
      <div class="progress-row">
        ${[1,2,3,4,5,6,7].map(i => `<div class="progress-dot ${progress[i] ? 'done':''}"></div>`).join('')}
      </div>
      <div class="timer-row"><span id="timerBadge">⏱ --:--</span> <span class="timer-note">— no searching, use your team!</span></div>
      <div class="riddle-text" style="margin-top:10px;">${riddle.q}</div>
      <input type="text" id="answerInput" placeholder="Type your answer…" autocomplete="off" />
      <div style="height:12px;"></div>
      <button class="submit" id="submitBtn">Transmit Answer</button>
      <div class="msg" id="msgBox"></div>
    </div>
  `;

  let timeLeft = riddle.t || 90;
  let retryUsed = false;
  let timerInterval;
  const timerBadge = document.getElementById('timerBadge');
  const answerInputEl = document.getElementById('answerInput');
  const submitBtnEl = document.getElementById('submitBtn');

  const updateBadge = () => {
    const m = String(Math.floor(timeLeft/60)).padStart(2,'0');
    const s = String(timeLeft%60).padStart(2,'0');
    timerBadge.textContent = `⏱ ${m}:${s}`;
    timerBadge.classList.remove('timer-warn');
    if(timeLeft <= 15) timerBadge.classList.add('timer-warn');
  };
  updateBadge();

  const startTimer = () => {
    timerInterval = setInterval(() => {
      timeLeft--;
      if(timeLeft <= 0){
        clearInterval(timerInterval);
        if(!retryUsed){
          retryUsed = true;
          timeLeft = riddle.t || 90;
          timerBadge.classList.remove('timer-over');
          const msgBox = document.getElementById('msgBox');
          if(msgBox) msgBox.textContent = "⏱ Time's up — one retry granted, timer restarted.";
          updateBadge();
          startTimer();
        } else {
          timerBadge.textContent = "⏱ Locked";
          timerBadge.classList.add('timer-over');
          if(answerInputEl) answerInputEl.disabled = true;
          if(submitBtnEl) submitBtnEl.disabled = true;
          const msgBox = document.getElementById('msgBox');
          if(msgBox) msgBox.textContent = "🔒 Out of time. Rescan this station's QR to get a fresh attempt.";
        }
      } else {
        updateBadge();
      }
    }, 1000);
  };
  startTimer();

  awayTrackingActive = true;

  const submit = async () => {
    const val = normalize(document.getElementById('answerInput').value);
    const msgBox = document.getElementById('msgBox');
    if(!val){ return; }
    const accepted = riddle.a.map(normalize);
    if(accepted.includes(val)){
      awayTrackingActive = false;
      clearInterval(timerInterval);
      progress[currentStation] = STATIONS[currentStation].word;
      const doneCount = [1,2,3,4,5,6,7].filter(i => progress[i]).length;
      if(doneCount === 7 && !progress.finishTime){
        progress.finishTime = Date.now();
      }
      await saveProgress(currentTeam, progress);
      renderAlreadySolved(progress, true);
    } else {
      msgBox.textContent = "✕ Not quite. Signal rejected — try again.";
      msgBox.className = "msg err";
    }
  };
  document.getElementById('submitBtn').addEventListener('click', submit);
  document.getElementById('answerInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') submit(); });
}

function renderWrongStation(nextStation){
  const nextName = STATIONS[nextStation].name;
  content.innerHTML = `
    <div class="card reveal">
      <div class="station-tag">Station ${currentStation} · Team ${currentTeam}</div>
      <div class="label" style="margin-top:10px; color: var(--danger);">Out of order</div>
      <div class="sub" style="margin:10px 0 4px;">This isn't your next stop. No skipping signals — head to your actual next station first.</div>
      <div class="next-line">Go to: <b>Station ${nextStation} · ${nextName}</b></div>
      <button class="back-btn" id="backToTeamBtn" style="margin:18px auto 0;">← wrong team?</button>
    </div>
  `;
  document.getElementById('backToTeamBtn').addEventListener('click', renderTeamSelect);
}

function renderDisqualified(progress){
  content.innerHTML = `
    <div class="card">
      <div class="station-tag">Team ${currentTeam}</div>
      <div class="label" style="margin-top:10px; color: var(--danger);">🚫 Disqualified</div>
      <div class="sub" style="margin:10px 0 4px;">This team left the app while a question was unanswered${progress.disqualifiedStation ? ` (Station ${progress.disqualifiedStation})` : ''}, more than once. The run has ended — please find your host.</div>
      <button class="back-btn" id="backToTeamBtn" style="margin:18px auto 0;">← wrong team?</button>
    </div>
  `;
  document.getElementById('backToTeamBtn').addEventListener('click', renderTeamSelect);
}

function renderAlreadySolved(progress, justSolved){
  const doneCount = [1,2,3,4,5,6,7].filter(i => progress[i]).length;
  const allDone = doneCount === 7;

  if(allDone){
    renderFinal(progress);
    return;
  }

  const seq = SEQUENCE[currentTeam];
  const idx = seq.indexOf(currentStation);
  const nextStationId = seq[idx+1];
  const nextName = STATIONS[nextStationId].name;

  content.innerHTML = `
    <div class="card reveal">
      <div class="station-tag">Station ${currentStation} · Team ${currentTeam}</div>
      <div class="label" style="margin-top:10px;">${justSolved ? 'Signal decoded' : 'Already decoded'}</div>
      <div class="codeword">${STATIONS[currentStation].word}</div>
      <div class="sub" style="margin-top:8px; color: var(--amber);">📝 Remember this letter: <b>${STATIONS[currentStation].word[0]}</b> — you'll need it at the end.</div>
      <div class="progress-row">
        ${[1,2,3,4,5,6,7].map(i => `<div class="progress-dot ${progress[i] ? 'done':''}"></div>`).join('')}
      </div>
      <div class="next-line">Next stop: <b>${nextName}</b></div>
    </div>
  `;
}

const FINAL_PASSWORD = "WTTBAMF";

function renderFinal(progress){
  const phrase = [1,2,3,4,5,6,7].map(i => STATIONS[i].word).join(' ');
  content.innerHTML = `
    <div class="card final-card">
      <div class="label">All 5 signals decoded</div>
      <div class="final-phrase">"${phrase}"</div>
      <div class="sub">Go show this screen to your host to lock in your finish time.</div>

      <div class="lock-box">
        <div class="lock-title">🔒 Final Transmission — Locked</div>
        <div class="sub" style="margin-bottom:10px;">Every station left behind a single letter. Line them up in order to unlock what's next.</div>
        <div class="lock-row">
          <input type="text" id="lockInput" placeholder="ENTER CODE" autocomplete="off" />
          <button id="lockBtn">Unlock</button>
        </div>
        <div class="msg" id="lockMsg"></div>
      </div>
      <div id="lockedReveal"></div>
    </div>
  `;

  const tryUnlock = async () => {
    const val = document.getElementById('lockInput').value.trim().toUpperCase();
    const lockMsg = document.getElementById('lockMsg');
    if(val === FINAL_PASSWORD){
      lockMsg.textContent = "";
      document.querySelector('.lock-box').style.display = 'none';
      await renderLeaderboard();
    } else {
      lockMsg.textContent = "✕ Incorrect code.";
      lockMsg.className = "msg err";
    }
  };
  document.getElementById('lockBtn').addEventListener('click', tryUnlock);
  document.getElementById('lockInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') tryUnlock(); });
}

async function renderLeaderboard(){
  const target = document.getElementById('lockedReveal');
  target.innerHTML = `<div class="sub">Decrypting…</div>`;

  const all = {};
  for(const t of TEAMS){ all[t] = await getProgress(t); }

  const ranked = TEAMS
    .filter(t => [1,2,3,4,5,6,7].every(i => all[t][i]) && all[t].finishTime)
    .sort((a,b) => all[a].finishTime - all[b].finishTime);

  target.innerHTML = `
    <div class="lb-title">🏆 Wall of Fame</div>
    <table class="host-table" style="text-align:center;">
      <tr><th>Rank</th><th>Team</th><th>Finished</th></tr>
      ${ranked.map((t,idx) => `
        <tr>
          <td class="lb-rank ${idx===0 ? 'gold':''}">${idx+1}</td>
          <td><b>${t}</b></td>
          <td>${new Date(all[t].finishTime).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'})}</td>
        </tr>`).join('')}
    </table>
    <div class="sub" style="margin-top:16px;">Welcome to the family. 🎉 Head to the seniors' table to claim your spot.</div>
  `;
}

// ---------- HOST VIEW (now public: no password) ----------

let hostListenerRef = null;

function renderHost(){
  content.innerHTML = `<div class="card"><div class="label">Loading dashboard…</div></div>`;

  if(hostListenerRef) hostListenerRef.off();
  hostListenerRef = db.ref('hunt');

  hostListenerRef.on('value', (snap) => {
    const raw = snap.val() || {};
    const all = {};
    TEAMS.forEach(t => { all[t] = raw[t] || {}; });

    content.innerHTML = `
      <div class="card">
        <div class="label">Host Dashboard <span style="color:var(--cyan); font-size:11px;">● live</span></div>
        <table class="host-table">
          <tr><th>Team</th>${[1,2,3,4,5,6,7].map(i=>`<th>${i}</th>`).join('')}<th>Done</th><th>Status</th></tr>
          ${TEAMS.map(t => {
            const p = all[t];
            const doneCount = [1,2,3,4,5,6,7].filter(i => p[i]).length;
            const vCount = violationCount(p);
            const isDQ = vCount >= 2;
            const status = isDQ ? `🚫 DQ (station ${lastViolationStation(p) || '?'})` : (vCount >= 1 ? `⚠️ ${vCount} warning` : '✓ active');
            return `<tr>
              <td><b>${t}</b></td>
              ${[1,2,3,4,5,6,7].map(i => `<td><span class="pill ${p[i] ? 'on':''}"></span></td>`).join('')}
              <td>${doneCount}/${ALL_STATIONS.length}</td>
              <td style="${isDQ ? 'color: var(--danger);' : ''}">${status}</td>
            </tr>`;
          }).join('')}
        </table>
      </div>
      <button class="back-btn" id="backBtn">← back</button>
    `;
    document.getElementById('backBtn').addEventListener('click', () => {
      if(hostListenerRef){ hostListenerRef.off(); hostListenerRef = null; }
      boot();
    });
  });
}

// Catches browser back/forward navigation restoring the page from cache,
// which skips a normal reload — re-check for pending warnings/DQ here too.
window.addEventListener('pageshow', async () => {
  if(!currentTeam) return;
  const progress = await getProgress(currentTeam);
  const vCount = violationCount(progress);
  if(vCount >= 2){
    progress.disqualifiedStation = lastViolationStation(progress);
    renderDisqualified(progress);
  } else if(vCount >= 1 && (progress.violationSeen || 0) < vCount){
    renderWarning(vCount, async () => {
      progress.violationSeen = vCount;
      await saveProgress(currentTeam, progress);
      renderRiddle();
    });
  }
});

// ---------- BOOT ----------
function boot(){
  currentTeam = null;
  if(currentStation && STATIONS[currentStation]){
    renderTeamSelect();
  } else {
    renderStationPicker();
  }
}

boot();
</script>
